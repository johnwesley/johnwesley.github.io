last_reviewed: 2026-11-22
stops:   # least secure first; each stop adds a control to the ones before it
  - security: "No controls"
    usability: "Nothing in your way"
    basis: "Starting point: nothing in place"
  - security: "Two-step sign-in"
    usability: "One more prompt"
    better: "Passkey. One touch."
    better_at: 8.5
    basis: "Identity. Phishing-resistant multi-factor sign-in"
  - security: "Private network only"
    usability: "VPN first"
    better: "No VPN. Checked on every request."
    better_at: 8
    basis: "Networks. Per-request access checks in place of a network perimeter"
  - security: "Short-lived credentials"
    usability: "Your key expired again"
    better: "Issued automatically. Nothing to rotate."
    better_at: 7.5
    basis: "Identity. Automatically issued and renewed credentials for people and workloads"
  - security: "Trusted devices only"
    usability: "Not from your own laptop"
    better: "Any healthy device, checked silently"
    better_at: 7
    basis: "Devices. Device health checks at sign-in, regardless of who owns the device"
  - security: "Sensitive data stays put"
    usability: "You can't send that"
    better: "Labelled automatically, blocked only when it matters"
    better_at: 6.5
    basis: "Data. Automatic classification and risk-based sharing controls"
  - security: "Least privilege"
    usability: "Access denied. Ask your manager."
    better: "You start with what your job needs"
    better_at: 6
    basis: "Identity. Role-based defaults with self-service requests"
  - security: "No standing admin"
    usability: "Wait for approval"
    better: "Admin in one click, gone in an hour"
    better_at: 5.5
    basis: "Identity. Just-in-time, time-limited privileged access"
  - security: "Every change reviewed"
    usability: "Ships next week"
    better: "Checked automatically, shipped today"
    better_at: 5
    basis: "Applications and workloads. Automated checks in the delivery pipeline"
  - security: "No remote access"
    usability: "Drive to the datacenter"
    basis: "The far extreme: fully isolated"
